name: Build Exynos 850 Kernel for A13 with SukiSU-Ultra

on:
  workflow_dispatch:
    inputs:
      build_config:
        description: 'Build config (use universal3830_32bit_s for A13)'
        required: true
        default: 'universal3830_32bit_s'
      kernel_branch:
        description: 'Kernel branch'
        required: false
        default: 'android-4.19-stable'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        run: |
          echo "📥 Cloning kernel source..."
          git clone --depth=1 --branch "${{ inputs.kernel_branch }}" \
            https://github.com/Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850.git \
            kernel
          cd kernel
          echo "✅ Using kernel: $(grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL' Makefile | tr '\n' '.' | sed 's/\.$//')"

      - name: Install build dependencies
        run: |
          echo "📦 Installing dependencies..."
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex \
          libssl-dev libelf-dev bc git ccache python3 zip unzip curl wget

      - name: Integrate SukiSU-Ultra
        run: |
          cd kernel
          echo "🔓 Integrating SukiSU-Ultra (non-GKI mode)..."
          
          # Run SukiSU integration
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki || {
            echo "⚠️ SukiSU integration encountered issues, continuing build..."
          }
          
          # Verify KPM module was added
          if [ -f "drivers/kernel_pm/kpm.c" ]; then
            echo "✅ SukiSU kernel module found"
          fi

      - name: Build using Android build config
        id: build_kernel
        env:
          BUILD_CONFIG: build.config.${{ inputs.build_config }}
        run: |
          cd kernel
          echo "🏗️ Building with config: $BUILD_CONFIG"
          
          # Source the build configuration
          if [ ! -f "$BUILD_CONFIG" ]; then
            echo "❌ Build config not found: $BUILD_CONFIG"
            echo "Available configs:"
            ls build.config.*
            exit 1
          fi
          
          source "$BUILD_CONFIG" 2>/dev/null || true
          
          echo "Architecture: $ARCH"
          echo "Defconfig: $DEFCONFIG"
          echo "Clang version: $CLANG_VERSION"
          
          # Set up environment
          export ARCH=$ARCH
          export CROSS_COMPILE=$CROSS_COMPILE
          export CLANG_TRIPLE=$CLANG_TRIPLE
          
          # Apply the defconfig
          echo "Applying defconfig: $DEFCONFIG"
          make $DEFCONFIG
          
          # Build the kernel
          echo "Starting build..."
          make -j$(nproc)
          
          # Verify the build
          if [ -f "arch/$ARCH/boot/Image" ]; then
            echo "✅ Kernel image built successfully!"
            ls -lh "arch/$ARCH/boot/Image"
            echo "kernel_image=arch/$ARCH/boot/Image" >> $GITHUB_OUTPUT
            echo "kernel_version=4.19.227" >> $GITHUB_OUTPUT
          else
            echo "❌ Build failed - no kernel image found"
            exit 1
          fi

      - name: Package for flashing
        run: |
          cd kernel
          echo "📦 Creating flashable package..."
          
          # Download AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          
          # Copy the kernel image
          cp arch/arm64/boot/Image AnyKernel3/
          
          # Create device-specific anykernel.sh
          cat > AnyKernel3/anykernel.sh << 'EOF'
          #!/bin/sh
          ## AnyKernel3 Ramdisk Mod Script
          
          properties() {
            kernel.string=Exynos850 Kernel with SukiSU
            do.devicecheck=1
            do.modules=0
            do.systemless=1
            do.cleanup=1
            device.name1=a13
            device.name2=a135f
            device.name3=exynos850
          }
          
          block=/dev/block/platform/13500000.dwmmc0/by-name/BOOT;
          is_slot_device=0;
          ramdisk_compression=auto;
          
          . tools/ak3-core.sh;
          
          dump_boot;
          write_boot;
          EOF
          
          chmod +x AnyKernel3/anykernel.sh
          
          # Create the flashable ZIP
          cd AnyKernel3
          zip -r9 ../kernel-a13-sukisu.zip *
          
          echo "✅ Flashable ZIP created: kernel-a13-sukisu.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A13-Kernel-Build-${{ github.run_number }}
          path: |
            kernel/arch/arm64/boot/Image
            kernel/kernel-a13-sukisu.zip
            kernel/.config
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          echo "========================================="
          echo "           BUILD SUMMARY                 "
          echo "========================================="
          echo "Device: Samsung Galaxy A13 (SM-A135F)"
          echo "Kernel: Linux 4.19.227"
          echo "Config: ${{ inputs.build_config }}"
          echo "Branch: ${{ inputs.kernel_branch }}"
          echo "Root: SukiSU-Ultra integrated"
          echo ""
          echo "📥 Artifacts available above"
          echo "📁 Flash kernel-a13-sukisu.zip in recovery"
          echo "⚠️  Test thoroughly before daily use!"
          echo "========================================="
