name: Build Kernel with SukiSU

on:
  workflow_dispatch:
    inputs:
      select_device:
        description: 'Select device:'
        required: true
        type: choice
        options:
          - 'merlin'
      kernel_branch:
        description: 'Kernel branch/tag (optional)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # Step 1: Clone the Samsung kernel repository
      - name: Clone Samsung Kernel Source
        run: |
          echo "Cloning Samsung Exynos850 kernel repository..."
          git clone --depth=1 https://github.com/Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850.git kernel
          cd kernel
          if [ -n "${{ inputs.kernel_branch }}" ]; then
            echo "Checking out branch/tag: ${{ inputs.kernel_branch }}"
            git checkout ${{ inputs.kernel_branch }}
          fi
          echo "Kernel source cloned successfully"

      # Step 2: Verify kernel source structure
      - name: Verify kernel source
        run: |
          cd kernel
          echo "Kernel directory structure:"
          ls -la
          echo -e "\nChecking for essential kernel files..."
          if [ -f "Makefile" ]; then
            echo "✅ Makefile found"
          else
            echo "❌ ERROR: Makefile not found - not a valid kernel source"
            exit 1
          fi
          if [ -d "arch/arm64" ]; then
            echo "✅ ARM64 architecture directory found"
          else
            echo "❌ ERROR: ARM64 architecture not found"
            exit 1
          fi

      # Step 3: Find the correct defconfig for the device
      - name: Find device defconfig
        id: defconfig
        run: |
          cd kernel
          echo "Searching for defconfig files..."
          
          # First, check for device-specific defconfigs
          if [ -d "arch/arm64/configs" ]; then
            cd arch/arm64/configs
            echo "Available defconfigs:"
            ls *.defconfig | head -20
            
            # Try to find the right defconfig
            CONFIG=""
            # Search for A13 or Exynos850 related configs
            for pattern in "a13" "exynos850" "a135" "merlin"; do
              if [ -z "$CONFIG" ]; then
                CONFIG=$(ls | grep -i "$pattern" | head -1)
                if [ -n "$CONFIG" ]; then
                  echo "Found defconfig with pattern '$pattern': $CONFIG"
                  break
                fi
              fi
            done
            
            if [ -z "$CONFIG" ]; then
              CONFIG="exynos850_defconfig"
              echo "⚠️  No specific defconfig found, using default: $CONFIG"
            fi
            
            echo "config_name=$CONFIG" >> $GITHUB_OUTPUT
          else
            echo "❌ arch/arm64/configs directory not found"
            echo "config_name=exynos850_defconfig" >> $GITHUB_OUTPUT
          fi

      # Step 4: Integrate SukiSU-Ultra
      - name: Integrate SukiSU-Ultra
        run: |
          cd kernel
          echo "Current Linux version:"
          head -5 Makefile | grep VERSION
          
          echo "Running SukiSU-Ultra integration for non-GKI kernel..."
          
          # Download and run the setup script
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" -o setup_sukisu.sh
          if [ -f "setup_sukisu.sh" ]; then
            chmod +x setup_sukisu.sh
            ./setup_sukisu.sh nongki
          else
            echo "⚠️  Could not download SukiSU script, trying alternative method..."
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki || echo "SukiSU script execution had issues"
          fi
          
          # Check if integration worked
          if [ -f "drivers/kernel_pm/kpm.c" ]; then
            echo "✅ SukiSU-Ultra integrated successfully"
          else
            echo "⚠️  SukiSU integration may have failed - checking for other signs..."
            find . -type f -name "*.c" -o -name "*.h" | xargs grep -l "kpm\|suki" 2>/dev/null | head -10
            echo "Continuing build anyway..."
          fi

      # Step 5: Install build dependencies
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex \
          libssl-dev libelf-dev bc git ccache python3 rsync

      # Step 6: Build the kernel
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-dir: kernel
          config: ${{ steps.defconfig.outputs.config_name }}
          arch: arm64
          android-version: 12
          # Using GCC toolchain for better compatibility with older 4.19 kernel
          aosp-clang: false
          aosp-gcc: true
          aosp-gcc-version: "arm64-12"
          anykernel3: true
          use-ccache: true

      # Step 7: Upload the built kernel
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Kernel-Exynos850
          path: |
            kernel/out/AnyKernel3/*.zip
            kernel/out/arch/arm64/boot/Image
            kernel/out/.config
          retention-days: 7

      # Step 8: Final status
      - name: Display Build Info
        if: success()
        run: |
          echo "✅ Kernel build completed successfully!"
          echo "📦 Artifact name: Compiled-Kernel-Exynos850"
          echo "📁 Download from: GitHub Actions → Artifacts section"
          echo "🔧 Using defconfig: ${{ steps.defconfig.outputs.config_name }}"
          echo "⚡ Includes SukiSU-Ultra integration attempt"
