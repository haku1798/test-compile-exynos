name: Build Exynos 850 Kernel for A13 with SukiSU-Ultra

on:
  workflow_dispatch:
    inputs:
      build_config:
        description: 'Build config (use universal3830_32bit_s for A13)'
        required: true
        default: 'universal3830_32bit_s'
      kernel_branch:
        description: 'Kernel branch'
        required: false
        default: 'android-4.19-stable'
      sukisu_mode:
        description: 'SukiSU integration mode'
        required: false
        default: 'builtin'
        type: choice
        options:
          - 'builtin'
          - 'main'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        run: |
          echo "📥 Cloning kernel source..."
          git clone --depth=1 --branch "${{ inputs.kernel_branch }}" \
            https://github.com/Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850.git \
            kernel
          cd kernel
          echo "✅ Kernel version: $(grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL' Makefile | tr '\n' '.' | sed 's/\.$//')"

      - name: Analyze defconfig options
        run: |
          cd kernel
          echo "🔍 Available defconfig files in arch/arm64/configs/:"
          ls -la arch/arm64/configs/ 2>/dev/null || echo "No arch/arm64/configs directory"
          echo ""
          echo "🔍 Searching for all defconfig files..."
          find . -name "*defconfig*" -type f | grep -v ".git" | head -20

      - name: Install build dependencies
        run: |
          echo "📦 Installing dependencies..."
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex \
          libssl-dev libelf-dev bc git ccache python3 zip unzip curl wget

      - name: Integrate SukiSU-Ultra
        run: |
          cd kernel
          echo "🔓 Integrating SukiSU-Ultra in ${{ inputs.sukisu_mode }} mode..."
          
          # Download the setup script
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" -o setup_sukisu.sh
          
          if [ -f "setup_sukisu.sh" ]; then
            chmod +x setup_sukisu.sh
            echo "Running: ./setup_sukisu.sh ${{ inputs.sukisu_mode }}"
            ./setup_sukisu.sh ${{ inputs.sukisu_mode }} || {
              echo "⚠️ SukiSU integration script returned error, continuing build..."
            }
          else
            echo "❌ Failed to download setup script"
            echo "Trying direct execution..."
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s ${{ inputs.sukisu_mode }}
          fi
          
          # Post-integration verification
          echo "🔍 Verifying integration..."
          if [ -f "drivers/kernel_pm/kpm.c" ]; then
            echo "✅ SukiSU kernel module source found at drivers/kernel_pm/kpm.c"
          else
            echo "⚠️ SukiSU files not found in standard location"
          fi

      - name: Build using Android build config
        id: build_kernel
        env:
          BUILD_CONFIG: build.config.${{ inputs.build_config }}
          SUKISU_MODE: ${{ inputs.sukisu_mode }}
        run: |
          cd kernel
          echo "🏗️ Building with config: $BUILD_CONFIG"
          echo "SukiSU mode: $SUKISU_MODE"
          
          # Source the build configuration
          if [ ! -f "$BUILD_CONFIG" ]; then
            echo "❌ Build config not found: $BUILD_CONFIG"
            echo "Available configs:"
            ls build.config.*
            exit 1
          fi
          
          source "$BUILD_CONFIG" 2>/dev/null || true
          
          echo "📋 Build configuration:"
          echo "  Architecture: $ARCH"
          echo "  Original DEFCONFIG: $DEFCONFIG"
          echo "  Cross compiler: $CROSS_COMPILE"
          echo "  Clang version: $CLANG_VERSION"
          echo "  Target SoC: $TARGET_SOC"
          
          # Set up environment
          export ARCH=$ARCH
          export CROSS_COMPILE=$CROSS_COMPILE
          export CLANG_TRIPLE=$CLANG_TRIPLE
          
          # DETERMINE CORRECT DEFCONFIG
          # The build.config says universal3830_s_launching_defconfig but it doesn't exist
          # From exploration, we have: a13xx_defconfig and exynos850-a13xx_defconfig
          # Let's use the most appropriate one
          if [ -f "arch/$ARCH/configs/a13xx_defconfig" ]; then
            ACTUAL_DEFCONFIG="a13xx_defconfig"
            echo "✅ Using defconfig: $ACTUAL_DEFCONFIG (A13 specific)"
          elif [ -f "arch/$ARCH/configs/exynos850-a13xx_defconfig" ]; then
            ACTUAL_DEFCONFIG="exynos850-a13xx_defconfig"
            echo "✅ Using defconfig: $ACTUAL_DEFCONFIG (Exynos 850 A13)"
          else
            echo "❌ No suitable defconfig found!"
            echo "Available defconfigs in arch/$ARCH/configs/:"
            ls arch/$ARCH/configs/ 2>/dev/null || echo "Directory not found"
            exit 1
          fi
          
          # Apply the defconfig
          echo "Applying defconfig: $ACTUAL_DEFCONFIG"
          make $ACTUAL_DEFCONFIG
          
          # Update configuration for SukiSU mode
          echo "⚙️ Configuring kernel for SukiSU..."
          
          # First, ensure we have the scripts/config utility
          if [ ! -f "scripts/config" ]; then
            echo "⚠️ scripts/config not found, using sed for config changes"
            if [ "$SUKISU_MODE" = "builtin" ]; then
              # Enable KPM as built-in
              sed -i 's/# CONFIG_KPM is not set/CONFIG_KPM=y/' .config 2>/dev/null || true
              sed -i 's/CONFIG_KPM=m/CONFIG_KPM=y/' .config 2>/dev/null || true
            else
              # Enable KPM as module
              sed -i 's/# CONFIG_KPM is not set/CONFIG_KPM=m/' .config 2>/dev/null || true
              sed -i 's/CONFIG_KPM=y/CONFIG_KPM=m/' .config 2>/dev/null || true
            fi
          else
            if [ "$SUKISU_MODE" = "builtin" ]; then
              scripts/config --set-val CONFIG_KPM y
            else
              scripts/config --set-val CONFIG_KPM m
            fi
          fi
          
          # Also enable KALLSYMS and KALLSYMS_ALL for SukiSU
          sed -i 's/# CONFIG_KALLSYMS is not set/CONFIG_KALLSYMS=y/' .config 2>/dev/null || true
          sed -i 's/# CONFIG_KALLSYMS_ALL is not set/CONFIG_KALLSYMS_ALL=y/' .config 2>/dev/null || true
          
          # Finalize config
          echo "Finalizing kernel configuration..."
          make oldconfig
          
          # Build the kernel
          echo "🚀 Starting kernel build with $(nproc) threads..."
          make -j$(nproc)
          
          # Verify the build
          if [ -f "arch/$ARCH/boot/Image" ]; then
            echo "✅ Kernel image built successfully!"
            ls -lh "arch/$ARCH/boot/Image"
            echo "kernel_image=arch/$ARCH/boot/Image" >> $GITHUB_OUTPUT
            echo "kernel_version=4.19.227" >> $GITHUB_OUTPUT
            echo "defconfig_used=$ACTUAL_DEFCONFIG" >> $GITHUB_OUTPUT
          else
            echo "❌ Build failed - no kernel image found"
            echo "Trying with fewer threads..."
            make -j2 || {
              echo "Build still failed, checking for errors..."
              exit 1
            }
            
            # Check again
            if [ -f "arch/$ARCH/boot/Image" ]; then
              echo "✅ Kernel image built successfully with -j2!"
              ls -lh "arch/$ARCH/boot/Image"
              echo "kernel_image=arch/$ARCH/boot/Image" >> $GITHUB_OUTPUT
              echo "kernel_version=4.19.227" >> $GITHUB_OUTPUT
              echo "defconfig_used=$ACTUAL_DEFCONFIG" >> $GITHUB_OUTPUT
            else
              echo "❌ Build completely failed"
              exit 1
            fi
          fi

      - name: Create flashable package
        run: |
          cd kernel
          echo "📦 Creating flashable package..."
          
          # Download AnyKernel3
          if [ ! -d "AnyKernel3" ]; then
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          fi
          
          # Copy the kernel image
          cp arch/arm64/boot/Image AnyKernel3/
          
          # Create device-specific anykernel.sh
          cat > AnyKernel3/anykernel.sh << EOF
          #!/bin/sh
          ## AnyKernel3 Ramdisk Mod Script
          
          # Begin properties
          properties() {
            kernel.string=Exynos850 Kernel with SukiSU ${{ inputs.sukisu_mode }}
            do.devicecheck=1
            do.modules=0
            do.systemless=1
            do.cleanup=1
            device.name1=a13
            device.name2=a135f
            device.name3=exynos850
          }
          
          # Device block (common for Exynos devices)
          block=/dev/block/platform/13500000.dwmmc0/by-name/BOOT;
          is_slot_device=0;
          ramdisk_compression=auto;
          
          # Import patching functions/variables
          . tools/ak3-core.sh;
          
          # AnyKernel install
          dump_boot;
          write_boot;
          ## end install
          EOF
          
          chmod +x AnyKernel3/anykernel.sh
          
          # Create the flashable ZIP
          cd AnyKernel3
          zip -r9 ../kernel-a13-sukisu-${{ inputs.sukisu_mode }}-$(date +%Y%m%d).zip *
          
          echo "✅ Flashable ZIP created"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A13-Kernel-${{ inputs.sukisu_mode }}-${{ github.run_number }}
          path: |
            kernel/arch/arm64/boot/Image
            kernel/kernel-a13-sukisu-*.zip
            kernel/.config
            kernel/System.map
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          echo "========================================="
          echo "           🎉 BUILD COMPLETE              "
          echo "========================================="
          echo "📱 Device: Samsung Galaxy A13 (SM-A135F)"
          echo "🐧 Kernel: Linux 4.19.227"
          echo "⚙️  Build Config: ${{ inputs.build_config }}"
          echo "🔧 Defconfig Used: ${{ steps.build_kernel.outputs.defconfig_used || 'a13xx_defconfig' }}"
          echo "🔓 SukiSU: ${{ inputs.sukisu_mode }} mode"
          echo "🔄 Branch: ${{ inputs.kernel_branch }}"
          echo ""
          echo "📦 Artifacts:"
          echo "  • kernel-a13-sukisu-*.zip - Flash in recovery"
          echo "  • Image - Raw kernel image"
          echo "  • .config - Kernel configuration"
          echo ""
          echo "⚠️  IMPORTANT:"
          echo "   • The build config specified universal3830_s_launching_defconfig"
          echo "   • But we used ${{ steps.build_kernel.outputs.defconfig_used || 'a13xx_defconfig' }} as fallback"
          echo "   • Test thoroughly before daily use!"
          echo "========================================="
