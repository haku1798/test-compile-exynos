name: Build Exynos 850 Kernel for A13 with SukiSU-Ultra

on:
  workflow_dispatch:
    inputs:
      build_config:
        description: 'Build config (use universal3830_32bit_s for A13)'
        required: true
        default: 'universal3830_32bit_s'
      kernel_branch:
        description: 'Kernel branch'
        required: false
        default: 'android-4.19-stable'
      sukisu_mode:
        description: 'SukiSU integration mode'
        required: false
        default: 'builtin'
        type: choice
        options:
          - 'builtin'
          - 'main'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        run: |
          echo "📥 Cloning kernel source..."
          git clone --depth=1 --branch "${{ inputs.kernel_branch }}" \
            https://github.com/Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850.git \
            kernel
          cd kernel
          echo "✅ Kernel version: $(grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL' Makefile | tr '\n' '.' | sed 's/\.$//')"

      - name: Install build dependencies
        run: |
          echo "📦 Installing dependencies..."
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex \
          libssl-dev libelf-dev bc git ccache python3 zip unzip curl wget \
          llvm lld clang gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          libxml2-utils python3-pip

          # Install specific tools needed for this kernel
          pip3 install pyelftools

      - name: Integrate SukiSU-Ultra (builtin mode)
        run: |
          cd kernel
          echo "🔓 Integrating SukiSU-Ultra in ${{ inputs.sukisu_mode }} mode..."
          
          # Note: The SukiSU integration is actually using KernelSU internally
          # The output shows it cloned KernelSU repository
          echo "Running SukiSU/KernelSU integration..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s ${{ inputs.sukisu_mode }} || {
            echo "⚠️ SukiSU integration had warnings, continuing..."
          }
          
          # Verify integration
          if [ -d "KernelSU" ] || [ -d "drivers/kernel_pm" ]; then
            echo "✅ SukiSU/KernelSU integration found"
          else
            echo "⚠️ Checking for integration files..."
            find . -type d -name "*kernel*" -o -name "*kpm*" | head -10
          fi

      - name: Set up proper toolchain
        run: |
          echo "🔧 Setting up toolchain for 4.19 kernel..."
          
          # For 4.19 kernel, we need specific toolchain
          mkdir -p ${HOME}/toolchain
          cd ${HOME}/toolchain
          
          # Download AOSP GCC 4.9 (compatible with 4.19 kernel)
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/master.tar.gz -O gcc.tar.gz
          mkdir -p gcc
          tar -xzf gcc.tar.gz -C gcc --strip-components=1
          
          echo "GCC_PATH=${HOME}/toolchain/gcc" >> $GITHUB_ENV
          
      - name: Build kernel with GCC (compatible with 4.19)
        id: build_kernel
        env:
          BUILD_CONFIG: build.config.${{ inputs.build_config }}
          SUKISU_MODE: ${{ inputs.sukisu_mode }}
          GCC_PATH: ${{ env.GCC_PATH }}
        run: |
          cd kernel
          echo "🏗️ Building kernel with GCC for 4.19 compatibility..."
          
          # Source build config
          if [ ! -f "$BUILD_CONFIG" ]; then
            echo "❌ Build config not found: $BUILD_CONFIG"
            exit 1
          fi
          
          # Extract build variables
          ARCH=$(grep '^ARCH=' "$BUILD_CONFIG" | cut -d= -f2)
          CROSS_COMPILE=$(grep '^CROSS_COMPILE=' "$BUILD_CONFIG" | cut -d= -f2)
          DEFCONFIG=$(grep '^DEFCONFIG=' "$BUILD_CONFIG" | cut -d= -f2)
          
          echo "Architecture: $ARCH"
          echo "Cross compiler: $CROSS_COMPILE"
          echo "Defconfig: $DEFCONFIG"
          
          # Set up environment - Use GCC instead of Clang
          export ARCH=$ARCH
          export CROSS_COMPILE=$GCC_PATH/bin/aarch64-linux-android-
          export PATH=$GCC_PATH/bin:$PATH
          
          # Fix for assembler error: remove -EL flag if causing issues
          # Also disable problematic warnings
          export KCFLAGS="-Wno-error=gnu-variable-sized-type-not-at-end -Wno-gnu-variable-sized-type-not-at-end"
          
          # Determine actual defconfig to use
          if [ -f "arch/$ARCH/configs/a13xx_defconfig" ]; then
            ACTUAL_DEFCONFIG="a13xx_defconfig"
          elif [ -f "arch/$ARCH/configs/exynos850-a13xx_defconfig" ]; then
            ACTUAL_DEFCONFIG="exynos850-a13xx_defconfig"
          else
            echo "❌ No suitable defconfig found"
            exit 1
          fi
          
          echo "Using defconfig: $ACTUAL_DEFCONFIG"
          
          # Clean and configure
          make clean
          make mrproper
          
          # Apply defconfig
          echo "Applying $ACTUAL_DEFCONFIG..."
          make $ACTUAL_DEFCONFIG
          
          # Configure for SukiSU/KernelSU
          echo "Configuring for SukiSU in $SUKISU_MODE mode..."
          
          # Enable required options for KernelSU
          sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/' .config 2>/dev/null || true
          sed -i 's/# CONFIG_HAVE_KPROBES is not set/CONFIG_HAVE_KPROBES=y/' .config 2>/dev/null || true
          sed -i 's/# CONFIG_KPROBES_ON_FTRACE is not set/CONFIG_KPROBES_ON_FTRACE=y/' .config 2>/dev/null || true
          sed -i 's/# CONFIG_KALLSYMS is not set/CONFIG_KALLSYMS=y/' .config 2>/dev/null || true
          sed -i 's/# CONFIG_KALLSYMS_ALL is not set/CONFIG_KALLSYMS_ALL=y/' .config 2>/dev/null || true
          
          # Set KPM based on mode
          if [ "$SUKISU_MODE" = "builtin" ]; then
            sed -i 's/# CONFIG_KPM is not set/CONFIG_KPM=y/' .config 2>/dev/null || true
            sed -i 's/CONFIG_KPM=m/CONFIG_KPM=y/' .config 2>/dev/null || true
          else
            sed -i 's/# CONFIG_KPM is not set/CONFIG_KPM=m/' .config 2>/dev/null || true
            sed -i 's/CONFIG_KPM=y/CONFIG_KPM=m/' .config 2>/dev/null || true
          fi
          
          # Disable modules if not needed (simplifies build)
          echo "CONFIG_MODULES=n" >> .config 2>/dev/null || true
          
          # Finalize config
          echo "Finalizing configuration..."
          make oldconfig
          
          # Build the kernel
          echo "🚀 Building kernel..."
          
          # First try with limited threads to avoid memory issues
          if make -j2; then
            echo "✅ Build successful with -j2"
          else
            echo "⚠️ Build with -j2 failed, trying single thread..."
            make || {
              echo "❌ Build failed"
              echo "Last 50 lines of build log:"
              tail -50 .make.log 2>/dev/null || echo "No .make.log found"
              exit 1
            }
          fi
          
          # Verify build
          if [ -f "arch/$ARCH/boot/Image" ]; then
            echo "✅ Kernel image built successfully!"
            ls -lh "arch/$ARCH/boot/Image"
            echo "kernel_image=arch/$ARCH/boot/Image" >> $GITHUB_OUTPUT
            echo "kernel_version=4.19.227" >> $GITHUB_OUTPUT
            echo "defconfig_used=$ACTUAL_DEFCONFIG" >> $GITHUB_OUTPUT
          else
            echo "❌ Kernel image not found"
            exit 1
          fi

      - name: Create flashable package
        run: |
          cd kernel
          echo "📦 Creating flashable package..."
          
          # Clone AnyKernel3 if not exists
          if [ ! -d "AnyKernel3" ]; then
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          fi
          
          # Copy kernel image
          cp arch/arm64/boot/Image AnyKernel3/
          
          # Create minimal anykernel.sh
          cat > AnyKernel3/anykernel.sh << 'EOF'
          #!/bin/sh
          ## AnyKernel3 Ramdisk Mod Script
          
          # Begin properties
          kernel.string=Exynos850 Kernel 4.19.227 with SukiSU
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          device.name1=a13
          device.name2=a135f
          device.name3=exynos850
          
          # Device block
          block=/dev/block/platform/13500000.dwmmc0/by-name/BOOT;
          is_slot_device=0;
          ramdisk_compression=auto;
          
          # Import functions
          . tools/ak3-core.sh;
          
          # Install
          dump_boot;
          write_boot;
          EOF
          
          chmod +x AnyKernel3/anykernel.sh
          
          # Create ZIP
          cd AnyKernel3
          zip -r9 ../kernel-a13-4.19-sukisu-${{ inputs.sukisu_mode }}.zip *
          
          echo "✅ Flashable package created"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A13-Kernel-4.19-${{ inputs.sukisu_mode }}
          path: |
            kernel/arch/arm64/boot/Image
            kernel/kernel-a13-4.19-sukisu-*.zip
            kernel/.config
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          echo "========================================="
          echo "           BUILD SUMMARY                 "
          echo "========================================="
          echo "Device: Samsung Galaxy A13 (SM-A135F)"
          echo "Kernel: Linux 4.19.227"
          echo "Build Config: ${{ inputs.build_config }}"
          echo "Defconfig: ${{ steps.build_kernel.outputs.defconfig_used }}"
          echo "SukiSU Mode: ${{ inputs.sukisu_mode }}"
          echo "Toolchain: GCC 4.9 (AOSP)"
          echo ""
          echo "📦 Output: kernel-a13-4.19-sukisu-${{ inputs.sukisu_mode }}.zip"
          echo "📁 Flash in custom recovery"
          echo "⚠️  Test thoroughly before daily use!"
          echo "========================================="
