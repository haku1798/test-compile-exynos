name: Build Kernel with SukiSU

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel branch/tag (leave empty for default)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # Step 1: Clone the Samsung kernel repository
      - name: Clone Samsung Kernel Source
        run: |
          echo "Cloning Samsung Exynos850 kernel repository..."
          
          # First, try without specific branch to see what's available
          if [ -z "${{ inputs.kernel_branch }}" ]; then
            echo "No branch specified, cloning default branch..."
            git clone --depth=1 https://github.com/Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850.git kernel
          else
            echo "Trying to clone with branch: ${{ inputs.kernel_branch }}"
            # Try branch first, then tag if branch fails
            git clone --depth=1 --branch "${{ inputs.kernel_branch }}" https://github.com/Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850.git kernel || \
            echo "⚠️ Branch '${{ inputs.kernel_branch }}' not found, trying default branch..."
            if [ ! -d "kernel" ]; then
              git clone --depth=1 https://github.com/Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850.git kernel
            fi
          fi
          
          cd kernel
          echo "Current branch: $(git branch --show-current)"
          echo "Latest commit: $(git log --oneline -1)"

      # Step 2: Find the correct defconfig for the device
      - name: Find device defconfig
        id: defconfig
        run: |
          cd kernel
          echo "Searching for defconfig files..."
          
          # Common defconfig patterns for Exynos 850 devices
          CONFIG_CANDIDATES=(
            "exynos850_defconfig"
            "a13_defconfig"
            "a135f_defconfig"
            "a13x_defconfig"
            "s5e3830_defconfig"  # Exynos 850 chip codename
          )
          
          if [ -d "arch/arm64/configs" ]; then
            cd arch/arm64/configs
            echo "Available defconfigs in arch/arm64/configs/:"
            ls *.defconfig
            
            # Try each candidate
            CONFIG_FOUND=""
            for candidate in "${CONFIG_CANDIDATES[@]}"; do
              if [ -f "$candidate" ]; then
                CONFIG_FOUND="$candidate"
                echo "✅ Found matching defconfig: $candidate"
                break
              fi
            done
            
            if [ -z "$CONFIG_FOUND" ]; then
              # Fallback to any defconfig
              CONFIG_FOUND=$(ls *.defconfig | head -1)
              echo "⚠️  Using first available defconfig: $CONFIG_FOUND"
            fi
            
            echo "config_name=$CONFIG_FOUND" >> $GITHUB_OUTPUT
          else
            echo "❌ arch/arm64/configs directory not found"
            echo "config_name=exynos850_defconfig" >> $GITHUB_OUTPUT
          fi

      # Step 3: Integrate SukiSU-Ultra
      - name: Integrate SukiSU-Ultra
        run: |
          cd kernel
          echo "=== KERNEL VERSION INFO ==="
          head -10 Makefile | grep -E "VERSION|PATCHLEVEL|SUBLEVEL"
          echo ""
          
          echo "Integrating SukiSU-Ultra..."
          
          # Try the SukiSU integration
          if curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki; then
            echo "✅ SukiSU script executed"
          else
            echo "⚠️  SukiSU script failed, but continuing build..."
          fi
          
          # Check kernel config for SukiSU requirements
          if [ -f ".config" ] || [ -f "arch/arm64/configs/${{ steps.defconfig.outputs.config_name }}" ]; then
            echo "Checking kernel configuration..."
            # These are required for SukiSU/KernelSU
            REQUIRED_CONFIGS=("CONFIG_KPROBES=y" "CONFIG_HAVE_KPROBES=y" "CONFIG_KPROBES_ON_FTRACE=y")
            for config in "${REQUIRED_CONFIGS[@]}"; do
              echo "Looking for: $config"
            done
          fi

      # Step 4: Install build dependencies
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex \
          libssl-dev libelf-dev bc git ccache python3 rsync kmod

      # Step 5: Build the kernel
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-dir: kernel
          config: ${{ steps.defconfig.outputs.config_name }}
          arch: arm64
          android-version: 12
          aosp-clang: false
          aosp-gcc: true
          aosp-gcc-version: "arm64-12"
          anykernel3: true
          use-ccache: true
          # Additional flags for older kernels
          make-args: "LLVM=0"

      # Step 6: Upload the built kernel
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Kernel-Exynos850
          path: |
            kernel/out/AnyKernel3/*.zip
            kernel/out/arch/arm64/boot/Image
            kernel/out/.config
          retention-days: 7

      # Step 7: Final status
      - name: Display Build Info
        if: success()
        run: |
          echo "✅ Kernel build completed successfully!"
          echo "📦 Artifact name: Compiled-Kernel-Exynos850"
          echo "🔧 Used defconfig: ${{ steps.defconfig.outputs.config_name }}"
          echo "📁 Download from: GitHub Actions → Artifacts section"
